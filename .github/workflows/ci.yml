name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check dashboard JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          page = Path("static/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", page, flags=re.DOTALL | re.IGNORECASE)
          if not scripts:
              raise SystemExit("No inline JavaScript found in static/index.html")
          Path("/tmp/project-impact-lab-dashboard.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/project-impact-lab-dashboard.js
      - name: Test decision brief output with a valid schedule result
        run: node tests/test_decision_brief.js
      - name: Rebuild synthetic model and check committed artifact
        run: |
          python scripts/train_risk_model.py --rows 60000 --seed 20261010 --model-version synthetic-logistic-v1 --max-epochs 240 --output /tmp/risk-model-rebuilt.json
          python - <<'PY'
          import json
          from pathlib import Path

          expected = json.loads(Path("app/risk_model.json").read_text(encoding="utf-8"))
          actual = json.loads(Path("/tmp/risk-model-rebuilt.json").read_text(encoding="utf-8"))
          assert actual["training_metadata"]["total_rows"] == expected["training_metadata"]["total_rows"]
          assert actual["training_metadata"]["selected_epoch"] == expected["training_metadata"]["selected_epoch"]
          for key in ("coefficients", "means", "scales"):
              assert len(actual[key]) == len(expected[key])
              assert all(abs(a-b) < 1e-5 for a, b in zip(actual[key], expected[key])), key
          for key in ("accuracy", "precision", "recall", "f1", "roc_auc", "brier_score"):
              assert abs(actual["test_metrics"][key] - expected["test_metrics"][key]) <= 0.0001, key
          print("Synthetic model artifact reproduces from the committed generator.")
          PY
      - name: Smoke-test labeled/synthetic training CLI
        run: python scripts/train_risk_model.py --rows 3000 --seed 42 --max-epochs 30 --output /tmp/risk-model-smoke.json
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Test browser schedule upload and decision-brief download
        run: node tests/test_browser_workflow.cjs
      - run: python -m pytest -q
